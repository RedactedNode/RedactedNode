<title id="title">What I build</title>
<desc id="desc">AI orchestration. Approval gates · agent handoffs. Model routing · fallback · quotas. Knowledge &amp; decisions. Git-backed ledgers · provenance. Searchable archives · decision data. Web apps &amp; interfaces. Responsive PWAs · camera input. Dashboards · quotes · publishing. Backend &amp; data. Discord automation · SQL migrations. Tenant isolation · audit logs · jobs. Game infrastructure. Multi-instance Arma · mod tracking. FiveM resources · in-game UI. Deployment &amp; QA. Windows services · Docker · Caddy. Health checks · rollback · a11y tests. Media automation. Gameplay ingest · transcription · highlight review. Captioned vertical and horizontal exports.</desc>
