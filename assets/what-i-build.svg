<title id="title">What I build</title>
<desc id="desc">AI infrastructure. Governance · context continuity. Inference routing · failover · quotas. Knowledge engineering. Versioned records · provenance. Indexed archives · decision support. Application engineering. Responsive PWAs · design systems. Operator tooling · content workflows. Data &amp; integration. API integration · schema migrations. Access control · auditability · jobs. Platform operations. Instance isolation · lifecycle tooling. Configuration · dependency tracking. Delivery engineering. Containerization · reverse proxies. Health probes · rollback · E2E tests. Media pipelines. Media ingest · transcription · candidate scoring. Review workflows · captioned delivery exports.</desc>
