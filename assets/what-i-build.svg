<svg xmlns="http://www.w3.org/2000/svg" width="900" height="589" viewBox="0 0 900 589" role="img" aria-labelledby="title desc">
<title id="title">What I build</title>
<desc id="desc">Platform architecture. Service isolation · lifecycle management. Configuration · dependency management. Developer experience. Internal tooling · workflow automation. Reusable interfaces · design systems. Delivery engineering. Reproducible builds · containerization. Release validation · rollback readiness. Systems integration. API integration · relational persistence. Schema evolution · asynchronous jobs. Operational reliability. Health monitoring · failure recovery. Runbooks · environment isolation. AI platform engineering. Inference routing · provider abstraction. Failover · quotas · approval workflows. Governance &amp; knowledge systems. Access control · auditability · provenance. Context continuity · versioned operational knowledge</desc>
